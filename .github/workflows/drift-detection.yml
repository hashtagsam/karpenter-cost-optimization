# Nightly drift detection: someone "fixed" something in the console?
# A non-empty plan opens (or updates) a GitHub issue.
name: drift-detection

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily (off the top of the hour)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_endpoint_public_access_cidrs: ${{ vars.TF_ENDPOINT_CIDRS }}
      TF_VAR_admin_principal_arns: ${{ vars.TF_ADMIN_PRINCIPALS }}
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-drift-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"

      - name: terraform plan (detect drift)
        id: plan
        run: |
          set +e
          terraform plan -lock=false -no-color -detailed-exitcode > plan.log 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          tail -50 plan.log
          [ "$code" -ne 1 ]

      - name: Open or update drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('terraform/envs/dev/plan.log', 'utf8').slice(-60000);
            const title = 'Infrastructure drift detected (dev)';
            const body = `Nightly plan found differences between Terraform and AWS.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`hcl\n${log}\n\`\`\``;
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'drift' });
            if (issues.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['drift'] });
            }