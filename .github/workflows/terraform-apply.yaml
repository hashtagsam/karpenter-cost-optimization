# terraform apply on merge to main.
# The apply role can ONLY be assumed by a job running in the "dev" GitHub
# Environment, which is configured with required reviewers - so every
# apply is a human-approved, audited event.
#
# Environment "dev" variables: AWS_APPLY_ROLE_ARN (+ the repository variables
# listed in terraform-plan.yml).
name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/envs/dev/**"
  workflow_dispatch:

permissions:
  contents: read

# Never run two applies against the same state at once
concurrency:
  group: tf-apply-dev
  cancel-in-progress: false

jobs:
  apply:
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_endpoint_public_access_cidrs: ${{ vars.TF_ENDPOINT_CIDRS }}
      TF_VAR_admin_principal_arns: ${{ vars.TF_ADMIN_PRINCIPALS }}
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"

      # Plan and apply the exact same plan file - what was reviewed is what runs
      - run: terraform plan -no-color -out=tfplan
      - run: terraform apply -no-color tfplan