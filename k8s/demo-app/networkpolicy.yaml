# Zero-trust baseline for the namespace (enforced by the VPC CNI network
# policy agent, enabled in terraform/envs/dev/eks.tf).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Only the load generator may call the app; only Prometheus may scrape it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podinfo-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loadtest
      ports:
        - protocol: TCP
          port: 9898
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9797