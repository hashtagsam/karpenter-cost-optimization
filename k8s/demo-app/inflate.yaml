# Classic Karpenter demo: scale this from 0 -> N and watch nodes appear,
# then back to 0 and watch consolidation remove them.
#   kubectl -n demo scale deploy/inflate --replicas=30
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate
  namespace: demo
  annotations:
    checkov.io/skip1: CKV_K8S_8=pause container serves nothing to probe
    checkov.io/skip2: CKV_K8S_9=pause container serves nothing to probe
  labels:
    app.kubernetes.io/name: inflate
    team: platform
    cost-center: cc-0001
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: inflate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inflate
        team: platform
        cost-center: cc-0001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload-tier: general
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "1"
              memory: 1536Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]