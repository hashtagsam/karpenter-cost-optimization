apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# k6 may only resolve DNS and talk to podinfo - nothing else, not the internet
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k6-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: k6
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: demo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: podinfo
      ports:
        - { protocol: TCP, port: 9898 }