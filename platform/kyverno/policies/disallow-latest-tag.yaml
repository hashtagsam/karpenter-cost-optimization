# Mutable tags break reproducibility and let an untested image reach
# production on the next node replacement (which Karpenter does often).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Require pinned image tags or digests
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, kyverno, monitoring, opencost]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    # Accept a digest, or an explicit tag that is not "latest".
    # Only the part after the last "/" is inspected, so a registry port
    # (registry:5000/app) is not mistaken for a tag.
    - expression: >-
        variables.containers.all(c,
          c.image.contains('@sha256:') ||
          (c.image.substring(c.image.lastIndexOf('/') + 1).contains(':') &&
           !c.image.endsWith(':latest')))
      message: Images must use a pinned tag (not ':latest') or a digest.