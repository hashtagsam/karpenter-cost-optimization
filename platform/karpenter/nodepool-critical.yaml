# NodePool "critical": on-demand only, tainted, conservative disruption.
# For workloads that cannot tolerate a 2-minute Spot interruption notice
# (singletons, long-running jobs, latency-critical paths).
# Only namespaces labelled platform.example.io/tier=critical may tolerate
# the taint - enforced by Kyverno (platform/kyverno/policies).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: critical
spec:
  weight: 10

  template:
    metadata:
      labels:
        workload-tier: critical
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      taints:
        - key: workload-tier
          value: critical
          effect: NoSchedule

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small", "medium", "metal"]

      expireAfter: 720h
      terminationGracePeriod: 24h

  limits:
    cpu: "32"
    memory: 128Gi

  disruption:
    # Balanced: only consolidate when the savings outweigh the disruption
    # to running pods (GA since Karpenter v1.14).
    consolidationPolicy: Balanced
    consolidateAfter: 15m
    budgets:
      # One node at a time
      - nodes: "1"
      # Change freeze for cost/drift moves during business hours (UTC).
      # Empty-node cleanup is still allowed.
      - nodes: "0"
        reasons: ["Underutilized", "Drifted"]
        schedule: "0 8 * * mon-fri"
        duration: 10h